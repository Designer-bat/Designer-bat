<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Portfolio Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 2rem;
        }

        .form-section {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-section h2 {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin: 0.5rem 0 0.2rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #5cb85c;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #4cae4c;
        }

        .portfolio-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .portfolio-item {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: calc(33% - 1rem);
            overflow: hidden;
            text-align: center;
        }

        .portfolio-item img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .portfolio-item h3 {
            margin: 1rem 0;
        }

        @media (max-width: 768px) {
            .portfolio-item {
                width: 100%;
            }
        }

        .marketplace-section {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-top: 2rem;
        }

        .marketplace-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .marketplace-item img {
            max-width: 100px;
            height: auto;
            margin-right: 1rem;
        }

        .marketplace-item div {
            flex: 1;
        }

        .marketplace-item button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        .marketplace-item button:hover {
            background-color: #0056b3;
        }
        /* Footer Styles */
footer {
  text-align: center;
  padding: 20px;
  background-color: #28a745;
  color: white;
  font-size: 14px;
}

footer a {
  color: white;
  text-decoration: none;
  margin: 0 5px;
}

footer a:hover {
  text-decoration: underline;
}
    </style>
</head>
<body>
    <section class="marketplace-section">
        <h2>Marketplace</h2>
        <div id="marketplace">
            <div class="marketplace-item">
                <img src="example1.jpg" alt="Artwork 1">
                <div>
                    <h3>Abstract Painting</h3>
                    <p>Price: $150</p>
                    <p>Seller: John Doe</p>
                </div>
                <button>Buy Now</button>
            </div>

            <div class="marketplace-item">
                <img src="example2.jpg" alt="Artwork 2">
                <div>
                    <h3>Digital Illustration</h3>
                    <p>Price: $200</p>
                    <p>Seller: Jane Smith</p>
                </div>
                <button>Buy Now</button>
            </div>

            <div class="marketplace-item">
                <img src="example3.jpg" alt="Artwork 3">
                <div>
                    <h3>Photography Print</h3>
                    <p>Price: $100</p>
                    <p>Seller: Alex Brown</p>
                </div>
                <button>Buy Now</button>
            </div>
        </div>
    </section>
</div>

<script>
    function addPortfolioItem() {
        const artistName = document.getElementById('artistName').value;
        const bio = document.getElementById('bio').value;
        const artType = document.getElementById('artType').value;
        const artwork = document.getElementById('artwork').files;

        if (!artistName || !bio || artwork.length === 0) {
            alert('Please fill out all fields and upload at least one artwork.');
            return;
        }

        const previewSection = document.querySelector('.portfolio-preview');

        for (const file of artwork) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const portfolioItem = document.createElement('div');
                portfolioItem.classList.add('portfolio-item');

                portfolioItem.innerHTML = `
                    <img src="${e.target.result}" alt="Artwork">
                    <h3>${artistName}</h3>
                    <p>${bio}</p>
                    <p><strong>Type:</strong> ${artType}</p>
                `;

                previewSection.appendChild(portfolioItem);
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('portfolioForm').reset();
    }
</script>
<footer class="footer">
    <p>© 2024 ArtSphere. Empowering Local Artists Everywhere.</p>
</footer>
</body>
</html>
