<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaboration Tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .board {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            overflow-x: auto;
        }

        .column {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 250px;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .column h2 {
            margin-top: 0;
            text-align: center;
        }

        .task {
            background: #e9ecef;
            border-radius: 4px;
            padding: 1rem;
            margin-bottom: 1rem;
            cursor: grab;
        }

        .task:hover {
            background: #dee2e6;
        }

        .add-task {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            cursor: pointer;
            text-align: center;
        }

        .add-task:hover {
            background-color: #0056b3;
        }
        /* Footer Styles */
footer {
  text-align: center;
  padding: 20px;
  background-color: #28a745;
  color: white;
  font-size: 14px;
}

footer a {
  color: white;
  text-decoration: none;
  margin: 0 5px;
}

footer a:hover {
  text-decoration: underline;
}
    </style>
</head>
<body>
    <header>
        <h1>Collaboration Tools</h1>
        <p>Manage your projects and collaborate effectively</p>
    </header>

    <div class="board">
        <div class="column" id="requests">
            <h2>Requests</h2>
            <div class="task" draggable="true">Landing Page Template</div>
            <div class="task" draggable="true">Feature Image for Blog</div>
            <button class="add-task" onclick="addTask('requests')">Add Task</button>
        </div>
        <div class="column" id="inProduction">
            <h2>In Production</h2>
            <div class="task" draggable="true">New Favicon</div>
            <div class="task" draggable="true">Welcome Modal</div>
            <button class="add-task" onclick="addTask('inProduction')">Add Task</button>
        </div>
        <div class="column" id="inReview">
            <h2>In Review</h2>
            <div class="task" draggable="true">Hero Illustration</div>
            <button class="add-task" onclick="addTask('inReview')">Add Task</button>
        </div>
        <div class="column" id="approved">
            <h2>Approved</h2>
            <div class="task" draggable="true">Homepage Layout</div>
            <div class="task" draggable="true">Navigation Design</div>
            <button class="add-task" onclick="addTask('approved')">Add Task</button>
        </div>
    </div>

    <script>
        const tasks = document.querySelectorAll('.task');
        const columns = document.querySelectorAll('.column');

        tasks.forEach(task => {
            task.addEventListener('dragstart', dragStart);
            task.addEventListener('dragend', dragEnd);
        });

        columns.forEach(column => {
            column.addEventListener('dragover', dragOver);
            column.addEventListener('drop', drop);
        });

        function dragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.id);
            setTimeout(() => {
                e.target.style.display = 'none';
            }, 0);
        }

        function dragEnd(e) {
            e.target.style.display = 'block';
        }

        function dragOver(e) {
            e.preventDefault();
        }

        function drop(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text');
            const draggable = document.getElementById(id);
            e.target.appendChild(draggable);
        }

        function addTask(columnId) {
            const taskName = prompt('Enter task name:');
            if (taskName) {
                const column = document.getElementById(columnId);
                const task = document.createElement('div');
                task.className = 'task';
                task.draggable = true;
                task.textContent = taskName;
                task.addEventListener('dragstart', dragStart);
                task.addEventListener('dragend', dragEnd);
                column.insertBefore(task, column.querySelector('.add-task'));
            }
        }
    </script>
     <footer class="footer">
        <p>© 2024 ArtSphere. Empowering Local Artists Everywhere.</p>
     </footer>
</body>
</html>
