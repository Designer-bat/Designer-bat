<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Portfolio Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f9f9f9;
        }

        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 2rem;
        }

        .form-section {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-section h2 {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin: 0.5rem 0 0.2rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #5cb85c;
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #4cae4c;
        }

        .portfolio-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .portfolio-item {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: calc(33% - 1rem);
            overflow: hidden;
            text-align: center;
        }

        .portfolio-item img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .portfolio-item h3 {
            margin: 1rem 0;
        }

        @media (max-width: 768px) {
            .portfolio-item {
                width: 100%;
            }
        }
        /* Footer Styles */
footer {
  text-align: center;
  padding: 20px;
  background-color: #28a745;
  color: white;
  font-size: 14px;
}

footer a {
  color: white;
  text-decoration: none;
  margin: 0 5px;
}

footer a:hover {
  text-decoration: underline;
}
    </style>
</head>
<body>
    <header>
        <h1>Artist Portfolio Builder</h1>
        <p>Showcase your artistic talent to the world</p>
    </header>

    <div class="container">
        <section class="form-section">
            <h2>Build Your Portfolio</h2>
            <form id="portfolioForm">
                <label for="artistName">Artist Name</label>
                <input type="text" id="artistName" placeholder="Enter your name" required>

                <label for="bio">Artist Bio</label>
                <textarea id="bio" rows="4" placeholder="Tell us about yourself" required></textarea>

                <label for="artType">Type of Art</label>
                <select id="artType">
                    <option value="painting">Painting</option>
                    <option value="sculpture">Sculpture</option>
                    <option value="digital">Digital Art</option>
                    <option value="photography">Photography</option>
                    <option value="other">Other</option>
                </select>

                <label for="artwork">Upload Artwork</label>
                <input type="file" id="artwork" multiple accept="image/*">

                <button type="button" onclick="addPortfolioItem()">Add to Portfolio</button>
            </form>
        </section>

        <section class="portfolio-preview">
            <!-- Dynamic content will appear here -->
        </section>
    </div>

    <script>
        function addPortfolioItem() {
            const artistName = document.getElementById('artistName').value;
            const bio = document.getElementById('bio').value;
            const artType = document.getElementById('artType').value;
            const artwork = document.getElementById('artwork').files;

            if (!artistName || !bio || artwork.length === 0) {
                alert('Please fill out all fields and upload at least one artwork.');
                return;
            }

            const previewSection = document.querySelector('.portfolio-preview');

            for (const file of artwork) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const portfolioItem = document.createElement('div');
                    portfolioItem.classList.add('portfolio-item');

                    portfolioItem.innerHTML = `
                        <img src="${e.target.result}" alt="Artwork">
                        <h3>${artistName}</h3>
                        <p>${bio}</p>
                        <p><strong>Type:</strong> ${artType}</p>
                    `;

                    previewSection.appendChild(portfolioItem);
                };
                reader.readAsDataURL(file);
            }

            document.getElementById('portfolioForm').reset();
        }
    </script>
     <footer class="footer">
        <p>© 2024 ArtSphere. Empowering Local Artists Everywhere.</p>
     </footer>
</body>
</html>
