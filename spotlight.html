<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Spotlight</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .spotlight-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .spotlight-section img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .spotlight-section h2 {
            margin: 1rem 0 0.5rem;
            font-size: 2rem;
        }

        .spotlight-section p {
            color: #555;
            line-height: 1.5;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .gallery-item {
            width: calc(33% - 1rem);
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item h3 {
            text-align: center;
            margin: 1rem 0;
        }

        @media (max-width: 768px) {
            .gallery-item {
                width: 100%;
            }
        }
        /* Footer Styles */
footer {
  text-align: center;
  padding: 20px;
  background-color: #28a745;
  color: white;
  font-size: 14px;
}

footer a {
  color: white;
  text-decoration: none;
  margin: 0 5px;
}

footer a:hover {
  text-decoration: underline;
}
    </style>
</head>
<body>
    <header>
        <h1>Artist Spotlight</h1>
        <p>Celebrating talent and creativity</p>
    </header>

    <div class="container">
        <section class="spotlight-section">
            <img src="download 7.jpeg" alt="Spotlight Artist">
            <h2>Jane Doe</h2>
            <p>Jane Doe is an exceptional digital artist known for her stunning illustrations and creative use of colors. Her work has been featured in top galleries worldwide.</p>
        </section>

        <section>
            <h2 style="text-align:center;">Featured Artworks</h2>
            <div class="gallery">
                <div class="gallery-item">
                    <img src="images c.jpeg" alt="Artwork 1">
                    <h3>Abstract Dream</h3>
                </div>
                <div class="gallery-item">
                    <img src="images b.jpeg" alt="Artwork 2">
                    <h3>Color Symphony</h3>
                </div>
                <div class="gallery-item">
                    <img src="images a.jpeg" alt="Artwork 3">
                    <h3>Modern Landscape</h3>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
